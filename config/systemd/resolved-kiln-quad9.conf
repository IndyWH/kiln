# Kiln, for a machine set to filter-here: all lookups go to Quad9, which blocks known malware
# and phishing sites, encrypted. Install as /etc/systemd/resolved.conf.d/kiln-quad9.conf, then
# restart systemd-resolved. Not for a network whose router already filters: it would skip it.
[Resolve]
DNS=9.9.9.9#dns.quad9.net 149.112.112.112#dns.quad9.net 2620:fe::fe#dns.quad9.net 2620:fe::9#dns.quad9.net
DNSOverTLS=yes
Domains=~.
