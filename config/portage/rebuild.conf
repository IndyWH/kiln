# Kiln Linux, mlrig: /etc/portage/rebuild.conf
# Link-time and profile-guided optimisation, for the full rebuild in step 11.
# Owner's decision, 3 Nov 2026: these stay off until then, so the first desktop
# goes in with fewer build failures. make.conf has the line that turns them on.

# These warnings point to real faults under LTO, so they stop the build. A package
# that fails here gets safer settings in package.env, and the reason is written
# down in lessons/build.md.
WARNING_FLAGS="-Werror=odr -Werror=lto-type-mismatch -Werror=strict-aliasing"

COMMON_FLAGS="${COMMON_FLAGS} -flto ${WARNING_FLAGS}"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"
LDFLAGS="${COMMON_FLAGS} ${LDFLAGS}"

USE="${USE} lto pgo"

# Rust ignores the flags above. Full LTO, as recipes that choose thin only save build time.
CARGO_PROFILE_RELEASE_LTO="fat"

# Compile everything here. With getbinpkg left on, most of the rebuild would just
# reinstall the ready-built packages, which are not built for this chip.
FEATURES="-getbinpkg"
