# Kiln Linux: build torchvision's GPU code only for the RTX 4090's exact generation.
# The default, sm_75, leaves the driver to translate PTX from CUDA 13.4, which the
# 595.104.02 driver cannot do, so GPU calls fail with "unsupported toolchain".
# The recipe sets NVCC_FLAGS from NVCCFLAGS, so this is the name that reaches nvcc.
NVCCFLAGS="-O3 --gpu-architecture=sm_89"
