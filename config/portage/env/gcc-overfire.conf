# Kiln Linux: GCC and binutils, at maximum, for this chip. The same CPU as -march=native,
# spelled out by resolve-march-native --drop-cache-sizes, because the fast and efficient
# cores report different L1 cache sizes, and GCC's recipe refuses -march=native on that.
# -O3 turns on GCC's bootstrap-O3. USE lto and pgo do the rest, in package.use.
COMMON_FLAGS="-O3 -pipe -march=alderlake -mabm -mno-kl -mno-sgx -mno-widekl -mshstk"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"
