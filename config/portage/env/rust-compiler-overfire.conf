# Kiln Linux: the Rust compiler at maximum. RUSTFLAGS in make.conf target this CPU. LLVM's
# PGO needs Clang as the C and C++ compiler. env/dev-lang/rust runs the PGO stages.
CC="/usr/lib/llvm/22/bin/clang"
CXX="/usr/lib/llvm/22/bin/clang++"
AR="/usr/lib/llvm/22/bin/llvm-ar"
NM="/usr/lib/llvm/22/bin/llvm-nm"
RANLIB="/usr/lib/llvm/22/bin/llvm-ranlib"
COMMON_FLAGS="-O3 -pipe -march=native"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
LDFLAGS="${LDFLAGS} -fuse-ld=lld"
