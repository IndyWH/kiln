# Kiln Linux: LLVM, Clang and lld, at maximum, for this chip. Full LTO and -O3, built by
# Clang. LLVM's recipe removes LTO when GCC builds it, and it has no PGO option.
CC="/usr/lib/llvm/22/bin/clang"
CXX="/usr/lib/llvm/22/bin/clang++"
AR="/usr/lib/llvm/22/bin/llvm-ar"
NM="/usr/lib/llvm/22/bin/llvm-nm"
RANLIB="/usr/lib/llvm/22/bin/llvm-ranlib"
COMMON_FLAGS="-O3 -pipe -march=native -flto"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
LDFLAGS="${LDFLAGS} -fuse-ld=lld -flto"
