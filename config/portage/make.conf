# Kiln Linux, mlrig: /etc/portage/make.conf
# Reasons are in lessons/build.md. Hardware is in docs/HARDWARE.md.

# Build for this exact chip. Not -march=raptorlake, which turns on instruction
# sets this chip does not report. Stays out of binary package matching.
COMMON_FLAGS="-O2 -pipe -march=native"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"

# From cpuid2cpuflags on this chip. Only 12 of the 7,253 packages in the v3
# repo offer a flag the repo leaves off, so few ready-built packages are lost.
CPU_FLAGS_X86="aes avx avx2 avx_vnni bmi1 bmi2 f16c fma3 mmx mmxext pclmul popcnt rdrand sha sse sse2 sse3 sse4_1 sse4_2 ssse3 vpclmulqdq"

# 32 threads and 96 GB. Lower these for any package that runs short of memory.
MAKEOPTS="-j32 -l32"
EMERGE_DEFAULT_OPTS="--jobs=4 --load-average=32"

# Use ready-built packages first, with signatures checked (binrepos.conf).
FEATURES="getbinpkg"

# Build on the @cache section, which stays out of system snapshots. Step 7 must
# create this folder. Not in memory: there is no swap to fall back on.
PORTAGE_TMPDIR="/var/cache/portage-build"

# The WX 3200 runs the desktop. The RTX 4090 is for compute.
VIDEO_CARDS="amdgpu radeonsi nvidia"

# Free software, firmware, microcode and NVIDIA. Nothing that forbids sharing.
ACCEPT_LICENSE="-* @BINARY-REDISTRIBUTABLE"

L10N="en-GB en"

# Build tools print in plain English, so logs are easy to search.
LC_MESSAGES=C.UTF-8

# Step 11 only: remove the # below to turn on LTO and PGO for the full rebuild.
# source /etc/portage/rebuild.conf
