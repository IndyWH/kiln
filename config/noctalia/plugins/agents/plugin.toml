# Kiln: the four agents' status on the bar. Source: ~/Projects/kiln/config/noctalia/plugins/agents,
# installed in ~/.local/share/noctalia/plugins/agents. States come from kiln-agent-status.
id = "kiln/agents"
name = "Kiln agents"
