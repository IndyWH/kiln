# Kiln Linux, mlrig: start-up image settings.
# Only what this machine needs. The start-up stage runs before the disk locks,
# so it must not assemble or open anything on other disks.
hostonly="yes"
hostonly_cmdline="no"
compress="zstd"
early_microcode="yes"
add_dracutmodules+=" btrfs "
omit_dracutmodules+=" lvm mdraid crypt dm multipath nfs iscsi "
omit_drivers+=" nvidia nvidia_drm nvidia_modeset nvidia_uvm nouveau "
