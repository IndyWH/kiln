# Kiln: build from source for x86-64-v3, not -march=native. Owner's rule, 13 Nov 2026:
# use CachyOS's v3 packages, and build with x86-64-v3 when none exists.
# Loaded last, after CachyOS's /etc/makepkg.conf and rust.conf. Keeps all their other flags.
CFLAGS="${CFLAGS//-march=native/-march=x86-64-v3}"
CXXFLAGS="${CXXFLAGS//-march=native/-march=x86-64-v3}"
RUSTFLAGS="${RUSTFLAGS//target-cpu=native/target-cpu=x86-64-v3}"
